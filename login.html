---
title: Login Ufficiale
permalink: /login/
layout: base
---
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm w-100" style="max-width: 420px;">
      <div class="card-body p-4">

        <h2 class="text-center mb-4">Accedi</h2>

        <form>
          <div class="form-group mb-3">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Inserisci la tua email" required>
          </div>

          <div class="form-group mb-3">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Inserisci la password" required>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Ricordami</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Accedi
          </button>

        </form>

        <div class="text-center mt-3">
          <a href="#">Hai dimenticato la password?</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap Italia JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-italia@2.6.1/dist/js/bootstrap-italia.bundle.min.js"></script>

<script>
  const form = document.querySelector('form');

  form.addEventListener('submit', function(event) {
    event.preventDefault(); // evita il comportamento predefinito
    // qui potresti aggiungere eventuale validazione/login reale
    window.location.href = '/'; // reindirizza alla home
  });
</script>
