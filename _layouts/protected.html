---
layout: default
---


<div class="container-fluid bg-white">
  <div class="container py-5">
    <div class="row align-items-center">
      
      <div class="col-auto">
        <div class="avatar size-xxl" style="width: 160px; height: 160px;">
          <img src="{{ site.url }}/gabriel.png" alt="Foto Profilo Utente" class="rounded-circle border border-2 border-light shadow-sm">
        </div>
      </div>
      
      <div class="col mt-4 mt-lg-0 ps-lg-5">
        <h1 class="display-5 fw-bold text-primary mb-2">Gabriel Jones</h1>
        
        <div class="d-flex flex-column flex-md-row gap-3">
          <div class="d-flex align-items-center">
            <svg class="icon icon-sm icon-muted me-2"><use href="{{ site.url }}/sprites.svg#it-card"></use></svg>
            <span class="text-secondary">Codice Dipendente: <strong>5587</strong></span>
          </div>
          <div class="d-flex align-items-center">
            <svg class="icon icon-sm icon-muted me-2"><use href="{{ site.url }}/sprites.svg#it-mail"></use></svg>
            <span class="text-secondary">gabriel.jones@18f.it</span>
          </div>
        </div>
        
        <div class="mt-3">
          <span class="badge bg-success">Profilo Verificato</span>
          <span class="badge bg-danger">Profilo BiblioWin</span>
        </div>
      </div>

      <div class="col-12 col-lg-auto mt-4 mt-lg-0">
        <div class="d-grid d-md-flex gap-2">
          <button type="button" class="btn btn-outline-primary btn-icon">
            <svg class="icon icon-primary"><use href="{{ site.url }}/sprites.svg#it-pencil"></use></svg>
            <span>Modifica dati</span>
          </button>
          <button type="button" class="btn btn-primary btn-icon">
            <svg class="icon icon-white"><use href="{{ site.url }}/sprites.svg#it-settings"></use></svg>
            <span>Impostazioni</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
