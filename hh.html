<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Responsive con Dropdown</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Header principale */
    .custom-header {
      background-color: #CE3A1A;
      color: white;
      position: relative;
      font-family: 'Arial Black', sans-serif;
      padding: 1rem 1rem 1rem 1rem;
    }

    /* Linea sottostante */
    .custom-header::after {
      content: "";
      display: block;
      height: 6px;
      width: 100%;
      background-color: #D4A017;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    /* Navbar link */
    .custom-navbar .nav-link,
    .custom-navbar .dropdown-toggle {
      color: white !important;
      font-size: 1.2rem;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
    }

    .custom-navbar .nav-link:hover,
    .custom-navbar .dropdown-menu .dropdown-item:hover {
      color: #FFD966 !important;
      transform: scale(1.05);
    }

    /* Hamburger a sinistra */
    .navbar-toggler {
      border: none;
      font-size: 1.5rem;
      color: white;
    }

    /* Dropdown menu stile */
    .dropdown-menu {
      background-color: #CE3A1A;
    }

    .dropdown-menu .dropdown-item {
      color: white;
      font-weight: bold;
    }

    .dropdown-menu .dropdown-item:hover {
      color: #FFD966;
      background-color: transparent;
    }

    /* Titolo e navbar flex */
    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Titolo grande */
    .header-content h1 {
      font-size: 2.5rem;
      margin: 0;
      letter-spacing: 2px;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header-content h1 {
        font-size: 1.8rem;
        text-align: center;
      }
      .custom-navbar .nav-link,
      .custom-navbar .dropdown-toggle {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <header class="custom-header">
    <div class="header-content">
      <!-- Hamburger -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks" aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
        &#9776;
      </button>

      <!-- Titolo -->
      <h1>Il Mio Header</h1>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md custom-navbar mt-3">
      <div class="container justify-content-center">
        <div class="collapse navbar-collapse" id="navbarLinks">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Chi Siamo
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Team</a></li>
                <li><a class="dropdown-item" href="#">Mission</a></li>
              </ul>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Servizi
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Web Design</a></li>
                <li><a class="dropdown-item" href="#">Marketing</a></li>
              </ul>
            </li>

            <li class="nav-item"><a class="nav-link" href="#">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contatti</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
