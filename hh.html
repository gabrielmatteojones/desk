<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Grafico</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Header principale */
    .custom-header {
      background-color: #CE3A1A;
      color: white;
      padding: 2rem 0; /* più respiro verticale */
      text-align: center;
      position: relative;
      font-family: 'Arial Black', sans-serif;
    }

    /* Linea sottostante più spessa */
    .custom-header::after {
      content: "";
      display: block;
      height: 9px; /* linea più spessa */
      width: 100%;
      background-color: #D4A017; /* colore senape */
      position: absolute;
      bottom: 0;
      left: 0;
    }

    /* Titolo più grande */
    .custom-header h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }

    /* Link sotto il titolo più grandi e impattanti */
    .header-links {
      margin-top: 1rem;
    }

    .header-links a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-size: 1.25rem; /* link più grandi */
      font-weight: bold;
      padding: 0.25rem 0.5rem;
      transition: all 0.2s ease-in-out;
    }

    .header-links a:hover {
      color: #FFD966; /* variante chiara senape */
      transform: scale(1.1); /* effetto leggero al passaggio del mouse */
    }

    /* Responsive: riduce leggermente titolo e link su schermi piccoli */
    @media (max-width: 768px) {
      .custom-header h1 {
        font-size: 2.2rem;
      }

      .header-links a {
        font-size: 1rem;
        margin: 0 0.5rem;
      }
    }
  </style>
</head>
<body>

  <header class="custom-header">
    <h1>Il Mio Header</h1>
    <div class="header-links">
      <a href="#">Home</a>
      <a href="#">Chi Siamo</a>
      <a href="#">Servizi</a>
      <a href="#">Portfolio</a>
      <a href="#">Contatti</a>
    </div>
  </header>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
