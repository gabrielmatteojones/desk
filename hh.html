<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Responsive Corretto</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Header principale */
    .custom-header {
      background-color: #CE3A1A;
      color: white;
      text-align: center;
      position: relative;
      font-family: 'Arial Black', sans-serif;
      padding: 2rem 0 1rem 0;
    }

    .custom-header h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }

    /* Linea sottostante */
    .custom-header::after {
      content: "";
      display: block;
      height: 6px;
      width: 100%;
      background-color: #D4A017;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    /* Navbar link */
    .custom-navbar .nav-link {
      color: white !important;
      font-size: 1.25rem;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
    }

    .custom-navbar .nav-link:hover {
      color: #FFD966 !important;
      transform: scale(1.1);
    }

    /* Hamburger button styling */
    .navbar-toggler {
      border: none;
      font-size: 1.5rem;
      color: white;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .custom-header h1 {
        font-size: 2rem;
      }

      .custom-navbar .nav-link {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <header class="custom-header">
    <h1>Il Mio Header</h1>

    <!-- Navbar Bootstrap -->
    <nav class="navbar navbar-expand-md custom-navbar">
      <div class="container justify-content-center">
        <!-- Hamburger -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks" aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
          &#9776;
        </button>

        <!-- Link -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarLinks">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Chi Siamo</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Servizi</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contatti</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
